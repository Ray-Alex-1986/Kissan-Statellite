# farm-portal client: serve the built SPA and proxy API + uploaded files to
# the farmportal-server container (compose service name `server` resolves on
# the compose network). Replicates the dev-time Vite proxy in vite.config.js.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Backend REST API (including multipart field-photo uploads).
    location /api/ {
        proxy_pass http://server:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 25m;
    }

    # Uploaded field photos served by the API container.
    location /uploads/ {
        proxy_pass http://server:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback: client-side routes (/farmer, /admin, ...) serve index.html.
    # index.html must never be cached: it is the only reference to the
    # content-hashed JS/CSS bundles, so a stale cached copy pins users to an
    # old release (symptom: new features invisible until a hard refresh).
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable: cache aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
